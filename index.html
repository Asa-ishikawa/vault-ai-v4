<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>跳び箱AI採点システム Ver4.0</title>

    <link rel="stylesheet" href="style.css">

    <!-- MediaPipe Pose -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

</head>

<body>

<div class="container">

    <h1>★★★★テスト★★★★</h1>

    <!-- 基本情報 -->
    <section class="card">

        <h2>基本情報</h2>

        <label for="studentName">生徒名</label>

        <input
            type="text"
            id="studentName"
            placeholder="名前を入力">

        <label for="skill">技</label>

        <select id="skill">

            <option value="開脚跳び">開脚跳び</option>
            <option value="閉脚跳び">閉脚跳び</option>
            <option value="台上前転">台上前転</option>

        </select>

    </section>

    <!-- 動画 -->
    <section class="card">

        <h2>動画</h2>

        <input
            type="file"
            id="videoFile"
            accept="video/*">

        <div id="videoContainer">

            <video
                id="video"
                controls
                playsinline>
            </video>

            <canvas id="outputCanvas"></canvas>

        </div>

    </section>

    <!-- ボタン -->
    <section class="card">

        <button id="detectBtn">

            AI骨格検出開始

        </button>

    </section>

   <!-- 状態 -->
<section class="card">

    <h2>状態</h2>

    <p id="status">
        動画を選択してください
    </p>

    <hr>

    <h3>フェーズ検出</h3>

    <div id="phaseInfo">

        未解析

    </div>

</section>

    <!-- 採点 -->
    <section class="card">

        <h2>採点結果</h2>

        <table>

            <tr>

                <th>Dスコア</th>

                <td id="dScore">-</td>

            </tr>

            <tr>

                <th>Eスコア</th>

                <td>

                    <input
                        type="number"
                        id="eScore"
                        value="10.0"
                        min="0"
                        max="10"
                        step="0.1">

                </td>

            </tr>

            <tr>

                <th>総合得点</th>

                <td id="totalScore">-</td>

            </tr>

        </table>

    </section>
    <!-- AI評価フィードバック -->

<section class="card">

    <h2>AI評価コメント</h2>

<div
    id="kneeDebug"
    style="
        margin-top:10px;
        padding:10px;
        background:#f5f5f5;
        border-radius:8px;
        font-size:14px;
    "
>
    膝角度候補：解析待ち
</div>

    <div id="feedback">

        解析するとAI評価が表示されます

    </div>

</section>

</div>
<script src="pose.js?v=6.2"></script>
<script src="utils.js?v=6.2"></script>
<script src="phase.js?v=6.2"></script>
<script src="score.js?v=6.2"></script>
<script src="feedback.js?v=6.2"></script>
<script src="app.js?v=6.2"></script>

</body>

</html>
